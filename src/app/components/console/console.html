<div class="p-3 border-box no-hover d-flex flex-column gap-3 elements-bcg">
  <p>CONSOLE</p>
  <div class="border-box p-3 no-hover console-bcg">
    @if (this.executorService.consoleValues().length > 0) {
      @for (value of this.executorService.consoleValues(); track $index) {
        <p>
          <i>{{ value }}</i>
        </p>
        <p></p>
      }
    } @else {
      <p><i>Waiting for emissions...</i></p>
    }
  </div>
</div>
