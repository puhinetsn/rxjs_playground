<div class="border-box no-hover elements-bcg p-3">
  <div class="py-2">
    <p class="border-line-b text-center">
      <span class="px-2">Observable source$</span>
      {{ observableExecutor() | json }}
    </p>
  </div>
  <div class="d-flex align-items-center gap-3 overflow-auto">
    @for (subsc of subscriptions(); track $index) {
      <app-subscription
        [subscription]="subsc"
        (addNewOperatorEvent)="addNewOperator($event, $index)"
        (removeOperatorEvent)="removeOperator($event, $index)"
        (deleteSubscEvent)="deleteSuscription($index)"
      />
    }
    <app-add-subscriber (subsc)="addNewSubscriber()" />
  </div>
</div>
