<app-header />
<div>
  <div class="row w-100 p-4">
    <app-pipeline-canvas class="col-8" />
    <div class="col-4 d-flex flex-column gap-3">
      <app-input-values [(inputValues)]="inputValues" />
      <app-controls
        (emitNextValue)="emitValues()"
        (emitNextStep)="emitStep()"
        (emitRunAll)="emitAll()"
        (emitReset)="emitReset()"
      />
      <app-console />
    </div>
  </div>
</div>
